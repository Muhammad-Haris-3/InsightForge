name: keep-backend-awake

# The API runs on Render's free tier, which stops the container after ~15 minutes
# with no traffic. The next visitor then pays a cold start of roughly a minute,
# during which Render's router answers 502 — which is what made the app look
# broken. Pinging /health on a schedule keeps the container in service.
#
# Two things worth knowing about GitHub's scheduler before trusting this:
#   * `schedule` is best-effort, and far weaker than the cron expression suggests.
#     Measured on this repo, a "*/10" schedule actually delivered runs 67 minutes
#     apart — GitHub throttles frequent schedules heavily. Relying on run frequency
#     therefore does not work: Render sleeps after ~15 minutes, so hourly runs
#     would leave it asleep most of the time.
#
#     So the frequency comes from *inside* a run instead. Each job stays alive for
#     the best part of an hour, pinging every few minutes, which keeps the backend
#     warm regardless of when GitHub next decides to start one. The schedule only
#     has to fire often enough to keep a pinger alive, and concurrency below makes
#     a newer run replace an older one rather than queue behind it.
#   * GitHub disables scheduled workflows on a repo with no commits for 60 days.
#     If the API starts sleeping again after a quiet stretch, check whether this
#     workflow was auto-disabled before looking anywhere else.
#
# Actions minutes are free and unlimited on public repos, so this costs nothing.

on:
  schedule:
    # Asks often; GitHub will honour a fraction of these. Each run covers a long
    # stretch on its own, so a dropped one costs coverage rather than breaking it.
    - cron: "*/15 * * * *"
  # Lets you trigger a wake-up by hand from the Actions tab — handy right before
  # sending the live link to someone.
  workflow_dispatch:

# Exactly one pinger at a time. A newer run takes over from the one in flight
# instead of queueing behind it, which would otherwise leave a gap while a stale
# job finished.
concurrency:
  group: keep-backend-awake
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    # Just under an hour, so a run is still alive when the next one is due even if
    # GitHub delivers that one late.
    timeout-minutes: 58
    env:
      HEALTH_URL: https://insightforge-api-muyx.onrender.com/health
      # Comfortably inside Render's ~15 minute idle window.
      PING_INTERVAL_SECONDS: "300"
      PINGS_PER_RUN: "11"
    steps:
      - name: Keep /health warm for the life of this run
        run: |
          set -uo pipefail
          failures=0

          for attempt in $(seq 1 "$PINGS_PER_RUN"); do
            [ "$attempt" -gt 1 ] && sleep "$PING_INTERVAL_SECONDS"

            # --max-time 120 because a cold start has to boot pandas/scipy/sklearn;
            # a short timeout would abandon the very wake-up we are paying for.
            code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 120 "$HEALTH_URL" || echo "000")
            echo "ping $attempt/$PINGS_PER_RUN -> HTTP $code $(cat /tmp/body.txt)"

            # A 502/503 means Render is mid-boot: the ping did its job by waking
            # the container, so give it a moment and confirm it came up.
            if [ "$code" != "200" ]; then
              echo "  not up yet, waiting 45s to confirm"
              sleep 45
              code=$(curl -s -o /tmp/body.txt -w '%{http_code}' --max-time 120 "$HEALTH_URL" || echo "000")
              echo "  recheck -> HTTP $code $(cat /tmp/body.txt)"
            fi

            [ "$code" = "200" ] || failures=$((failures + 1))
          done

          # One failure is a cold start losing a race; several means the backend is
          # actually unhealthy, which should be visible in the Actions tab rather
          # than passing silently.
          echo "completed with $failures failed ping(s) of $PINGS_PER_RUN"
          if [ "$failures" -gt 2 ]; then
            echo "::error::Backend failed $failures of $PINGS_PER_RUN health pings"
            exit 1
          fi
